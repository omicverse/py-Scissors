# The separately contributed OmicVerse adapter is not bundled in this core.
omicverse:
  module: null
  since: null
parity:
  status: partial
  algorithm_class: deterministic
  # Multiple output-specific absolute/relative tolerances; no single scalar gate.
  metric: null
  threshold: null
  value: null
  fixture: >-
    Pinned Scissor 311560a1 synthetic R fixtures cover Gaussian, Binomial and Cox.
    Full LUAD: 4102 cells, 471 survival and 498 TP53 samples; fixed graph/folds.
    All nine corrected family/alpha comparisons pass with both solvers at
    thresh=1e-10; six coefficient comparisons at thresh=1e-8 remain failures.
    The API default remains 1e-7. Official Gaussian/Cox unsafe graph inputs
    are rejected; corrected semantics are not unchanged-R equivalence.
    See docs/VALIDATION_STATUS.md for output-specific tolerances and scope.
  test: tests/test_r_reference.py
artifacts:
  audit: docs/SEMANTICS.md
  report: docs/VALIDATION_STATUS.md
  compare_notebook: null
  function_notebook: null
functions:
  - r: Scissor
    py: scissor_py.scissor
    status: partial
    parity: approx
    test: tests/test_r_reference.py
    note: >-
      Expression-to-selection workflow for Gaussian, Binomial and Cox; requires
      an explicit cell graph. Does not reproduce Seurat preprocessing or SNN
      construction. Saved R expression-harness fixtures check coefficients,
      labels, alpha and lambda. Official/corrected modes remain explicit.
  - r: APML1
    py: scissor_py.fit_path
    status: partial
    parity: approx
    test: tests/test_r_reference.py
    note: >-
      APML1-Net regularization paths for Gaussian, Binomial and Cox only;
      unrelated APML1 penalties are not implemented. Defined official behavior
      is checked against pinned R fixtures; unsafe official Gaussian/Cox graph
      inputs are rejected. Corrected mode is opt-in and numerically distinct.
  - r: APML1.cv
    py: scissor_py.cross_validate
    status: partial
    parity: approx
    test: tests/test_r_reference.py
    note: >-
      Fixed-graph APML1-Net cross-validation with family-specific losses,
      lambda.min and lambda.1se. Parity uses identical explicit folds;
      equal R/Python RNG seeds do not imply equal folds. Other APML1 penalties
      and the original Seurat workflow are outside this port's scope.
